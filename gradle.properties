# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# Kotlin incremental compilation is disabled: changing a default-constructor signature
# left test classes compiled against the removed synthetic constructor (NoSuchMethodError
# while build/classes/kotlin/main was already new). The build-cache guard alone did not
# catch it; a full compile of this module takes seconds.
kotlin.incremental=false
