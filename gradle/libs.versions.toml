[versions]

# Plugin versioning
pluginVersion = "0.19.8"

# dependencies versions
junitVersion = "6.1.3"
assertjCoreVersion = "4.0.0-M1"
sqliteJdbcVersion = "3.53.4.0"
gsonVersion = "2.14.0"
lGoodDatePickerVersion = "11.2.1"

[libraries]

junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitVersion" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertjCoreVersion" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junitVersion" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitVersion" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitVersion" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbcVersion" }
gson = { module = "com.google.code.gson:gson", version.ref = "gsonVersion" }
lgooddatepicker = { module = "com.github.lgooddatepicker:LGoodDatePicker", version.ref = "lGoodDatePickerVersion" }

[plugins]

java = { id = "java" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.4.10" }
jetbrains-intellij-platform = { id = "org.jetbrains.intellij.platform", version = "2.18.1" }
ben-manes = { id = "io.github.ben-manes.versions", version = "0.61.0" }